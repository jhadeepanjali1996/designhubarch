backend:
  name: git-gateway
  branch: main

media_folder: ""
public_folder: ""

collections:
  - name: "gallery"
    label: "Gallery Items"
    files:
      - file: "gallery.json"
        label: "Gallery Data"
        name: "gallery_data"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["photo", "video"] }
              - { label: "File", name: "file", widget: "file" }
              - { label: "Poster (Video only)", name: "poster", widget: "image", required: false }
              - { label: "Room", name: "room", widget: "string", required: false }
